stages:
  - build
  - deploy

build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker info
    - docker build -t my-image .
  only:
    - main

deploy-rsync:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache rsync openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
  script:
    - chmod +x ./deploy.sh
    - ./deploy.sh
  only:
    - main
